<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Main - Wedding Invitation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #c62828; /* nền đỏ toàn trang */
      font-family: 'Segoe UI', sans-serif;
    }

    .save-date {
      background:#c62828;   /* khối cùng màu nền */
      color:#fff;           /* chữ trắng nổi bật */
      padding:60px 40px;
      text-align:center;
      border:3px solid #2196f3; /* viền xanh mảnh */
      border-radius:12px;
      line-height:1.5;
      max-width:800px;
      width:90%;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .save-date:hover {
      border-color:#64b5f6; /* đổi sang xanh sáng hơn */
      box-shadow:0 0 20px rgba(33,150,243,0.7); /* viền phát sáng */
    }

    .title {
      font-family:'Playfair Display', serif;
      font-size:48px;
      font-weight:bold;
      letter-spacing:4px;
      margin-bottom:20px;
    }

    .subtitle {
      font-family:'Cormorant Garamond', serif;
      font-size:28px;
      font-style:italic;
      margin-bottom:40px;
    }

    .names {
      font-family:'Playfair Display', serif;
      font-size:36px;
      margin:40px 0;
    }

    .date {
      font-family:'Playfair Display', serif;
      font-size:32px;
      font-weight:bold;
      margin-top:30px;
    }

    @media (max-width:600px) {
      .title { font-size:32px; }
      .subtitle { font-size:20px; }
      .names { font-size:24px; }
      .date { font-size:20px; }
    }
  </style>
</head>
<body>
  <div class="save-date">
    <p class="title">SAVE THE DATE</p>
    <p class="subtitle">We Get Married</p>
    <p class="names">TRUNG NGHĨA & NGỌC NGÂN</p>
    <p class="date">18.10.2026</p>
  </div>
</body>
</html>
