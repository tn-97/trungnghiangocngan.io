<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Main - Wedding Invitation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #c62828; /* nền đỏ toàn trang */
      font-family: 'Segoe UI', sans-serif;
    }

    .save-date {
      background:#fff;       /* khối trắng nổi bật */
      color:#c62828;         /* chữ đỏ đồng bộ */
      padding:8vh 5vw;
      text-align:center;
      border-radius:2vw;
      line-height:1.5;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 800px;
    }

    .title {
      font-family:'Playfair Display', serif;
      font-size:7vw;
      font-weight:bold;
      letter-spacing:0.5vw;
      margin-bottom:2vh;
    }

    .subtitle {
      font-family:'Cormorant Garamond', serif;
      font-size:4vw;
      font-style:italic;
      margin-bottom:4vh;
    }

    .names {
      font-family:'Great Vibes', cursive;
      font-size:6vw;
      margin:4vh 0;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:2vw;
    }

    .names .amp {
      font-size:7vw;
      font-weight:bold;
      font-family:'Playfair Display', serif;
    }

    .date {
      font-family:'Playfair Display', serif;
      font-size:6vw;
      font-weight:bold;
      margin-top:5vh;
      background:#c62828;
      color:#fff;
      display:inline-block;
      padding:1vh 3vw;
      border-radius:1vw;
    }

    @media (max-width:600px) {
      .title { font-size:9vw; }
      .subtitle { font-size:6vw; }
      .names { font-size:8vw; }
      .names .amp { font-size:9vw; }
      .date { font-size:8vw; }
    }
  </style>
</head>
<body>
  <div class="save-date">
    <p class="title">SAVE THE DATE</p>
    <p class="subtitle">We Get Married</p>
    <p class="names">
      <span class="name">TRUNG NGHĨA</span>
      <span class="amp">&</span>
      <span class="name">NGỌC NGÂN</span>
    </p>
    <p class="date">18.10.2026</p>
  </div>
</body>
</html>
