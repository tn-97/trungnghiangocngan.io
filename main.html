<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Main - Wedding Invitation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #c62828; /* nền đỏ toàn trang */
      font-family: 'Segoe UI', sans-serif;
    }

    .save-date {
      background:#fff;       /* khối trắng nổi bật */
      color:#c62828;         /* chữ đỏ đồng bộ */
      padding: 60px 40px;
      text-align:center;
      border-radius: 20px;
      line-height:1.5;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 800px;
      width: 90%;
    }

    .title {
      font-family:'Playfair Display', serif;
      font-size: 48px;
      font-weight:bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-family:'Cormorant Garamond', serif;
      font-size: 28px;
      font-style:italic;
      margin-bottom: 40px;
    }

    .names {
      font-family:'Great Vibes', cursive;
      font-size: 42px;
      margin: 40px 0;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
    }

    .names .amp {
      font-size: 48px;
      font-weight:bold;
      font-family:'Playfair Display', serif;
    }

    .date {
      font-family:'Playfair Display', serif;
      font-size: 36px;
      font-weight:bold;
      margin-top: 40px;
      background:#c62828;
      color:#fff;
      display:inline-block;
      padding: 10px 30px;
      border-radius: 10px;
    }

    @media (max-width:600px) {
      .title { font-size: 32px; }
      .subtitle { font-size: 20px; }
      .names { font-size: 28px; }
      .names .amp { font-size: 32px; }
      .date { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="save-date">
    <p class="title">SAVE THE DATE</p>
    <p class="subtitle">We Get Married</p>
    <p class="names">
      <span class="name">TRUNG NGHĨA</span>
      <span class="amp">&</span>
      <span class="name">NGỌC NGÂN</span>
    </p>
    <p class="date">18.10.2026</p>
  </div>
</body>
</html>
