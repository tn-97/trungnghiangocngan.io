<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Wedding - Trung Nghĩa & Ngọc Ngân</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fffaf5;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #5c3d3d;
    }

    /* Save the Date section */
    .save-date {
      background:#c62828; /* nền đỏ sang trọng */
      color:#fff;         /* chữ trắng nổi bật */
      padding:8vh 5vw;
      text-align:center;
      border-radius:2vw;
      line-height:1.5; /* khoảng cách dòng hợp lý */
      margin: 5vh auto;
      max-width: 800px;
    }

    .title {
      font-family:'Playfair Display', serif; /* font sang trọng */
      font-size:7vw;
      font-weight:bold;
      letter-spacing:0.5vw;
      margin-bottom:2vh;
    }

    .subtitle {
      font-family:'Cormorant Garamond', serif;
      font-size:4vw;
      font-style:italic;
      margin-bottom:4vh;
    }

    .names {
      font-family:'Arial', cursive; /* font script mềm mại cho tên */
      font-size:6vw;
      margin:4vh 0;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:2vw;
    }

    .names .amp {
      font-size:7vw;
      font-weight:bold;
      font-family:'Playfair Display', serif; /* dấu & sang trọng */
    }

    .date {
      font-family:'Playfair Display', serif;
      font-size:6vw;
      font-weight:bold;
      margin-top:5vh;
      background:#fff;
      color:#c62828;
      display:inline-block;
      padding:1vh 3vw;
      border-radius:1vw;
    }

    /* Responsive cho điện thoại */
    @media (max-width:600px) {
      .title { font-size:9vw; }
      .subtitle { font-size:6vw; }
      .names { font-size:8vw; }
      .names .amp { font-size:9vw; }
      .date { font-size:8vw; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Trung Nghĩa & Ngọc Ngân</h1>
    <p>Chúng tôi hân hoan chào đón bạn đến ngày trọng đại!</p>
  </header>

  <!-- Save the Date section -->
  <div class="save-date">
    <p class="title">SAVE THE DATE</p>
    <p class="subtitle">We Get Married</p>
    <p class="names">
      <span class="name">TRUNG NGHĨA</span>
      <span class="amp">&</span>
      <span class="name">NGỌC NGÂN</span>
    </p>
    <p class="date">18.10.2026</p>
  </div>

  <footer>
    <p>© 2026 Trung Nghĩa & Ngọc Ngân Wedding</p>
  </footer>
</body>
</html>
