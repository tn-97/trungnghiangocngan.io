<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trung Nghĩa & Ngọc Ngân</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* hình nền mờ phía sau */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('imagebia/background.jpg'); /* thay bằng ảnh nền của bạn */
      background-size: cover;
      background-position: center;
      filter: blur(3px); /* độ mờ */
      transform: scale(1.1); /* tránh viền mờ bị lộ */
      z-index: -1;
    }

    /* =========================
       KHUNG TẤM THIỆP - CÂN ĐỐI TRÊN MỌI MÀN HÌNH
    ========================== */

    .cover {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;

      width: 100%;
      max-width: 420px;
    }

    .cover-frame {
      width: 100%;

      /* Giữ tỉ lệ ảnh bìa (dọc, kiểu thiệp cưới) và giới hạn chiều cao
         để không bị tràn màn hình trên mọi thiết bị */
      aspect-ratio: 3 / 4;
      max-height: 78vh;

      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      border: 3px solid rgba(255, 255, 255, 0.85);

      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .cover-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      padding: 14px 28px;
      background: #c62828;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(198,40,40,0.8), 0 0 30px rgba(198,40,40,0.6);
      animation: glow 1.5s infinite alternate, pulse 2s infinite;
      transition: transform 0.3s ease, opacity 0.4s ease;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px rgba(198,40,40,0.8); }
      to   { box-shadow: 0 0 25px rgba(198,40,40,1); }
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .btn:hover {
      background: #b71c1c;
      transform: scale(1.1);
    }

    .btn::before {
      content: "👉";
      font-size: 24px;
      animation: point 1s infinite alternate;
    }

    @keyframes point {
      from { transform: translateX(0); }
      to   { transform: translateX(-5px); }
    }

    @media (max-width: 480px) {
      .cover {
        max-width: 340px;
      }

      .btn {
        font-size: 17px;
        padding: 12px 22px;
      }
    }

    /* =========================
       HIỆU ỨNG CHUYỂN TRANG KHI MỞ THIỆP
    ========================== */

    .fade-out .cover-frame {
      transform: scale(0.9);
      opacity: 0;
    }

    .fade-out .btn {
      opacity: 0;
      pointer-events: none;
    }

    .page-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;

      background: radial-gradient(circle at center, #c62828 0%, #7b1f1f 100%);
      color: #fdd835;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition: opacity 0.6s ease;
    }

    .page-transition.show {
      opacity: 1;
      visibility: visible;
    }

    .transition-heart {
      font-size: 48px;
      animation: heartBeat 0.9s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    .transition-text {
      font-family: "Georgia", serif;
      font-size: 18px;
      letter-spacing: 1px;
    }

    /* Tôn trọng người dùng tắt hiệu ứng chuyển động */
    @media (prefers-reduced-motion: reduce) {
      .cover-frame,
      .btn,
      .page-transition {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="cover" id="cover">
    <div class="cover-frame">
      <img src="imagebia/anhbia.png" alt="Ảnh bìa cưới">
    </div>
    <a href="main.html" class="btn" id="openCard">Xem Thiệp Cưới</a>
  </div>

  <!-- LỚP HIỆU ỨNG CHUYỂN TRANG -->
  <div class="page-transition" id="pageTransition">
    <div class="transition-heart">💌</div>
    <div class="transition-text">Đang mở thiệp mời...</div>
  </div>

  <script>
    const btn = document.getElementById('openCard');
    const cover = document.getElementById('cover');
    const transitionOverlay = document.getElementById('pageTransition');

    btn.addEventListener('click', function(event) {
      event.preventDefault();

      /* GHI NHỚ: người dùng vừa bấm (có "user gesture"),
         báo cho trang thiệp chính biết để tự phát nhạc ngay khi mở */
      sessionStorage.setItem('autoplayMusic', '1');

      // Bước 1: thu nhỏ & mờ dần tấm thiệp bìa
      cover.classList.add('fade-out');

      // Bước 2: hiện lớp chuyển trang (màu đỏ + tim đập) ngay sau đó
      setTimeout(() => {
        transitionOverlay.classList.add('show');
      }, 250);

      // Bước 3: điều hướng sang thiệp chính khi hiệu ứng hoàn tất
      setTimeout(() => {
        window.location.href = btn.getAttribute('href');
      }, 950);
    });
  </script>
</body>
</html>
