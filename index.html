<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Wedding Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6f0;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #e8c6c6;
      padding: 40px;
    }
    header h1 {
      font-size: 48px;
      margin: 0;
      color: #5c3d3d;
    }
    header p {
      font-size: 20px;
      margin: 10px 0 0;
    }
    .section {
      padding: 50px 20px;
    }
    .section h2 {
      color: #5c3d3d;
      font-size: 32px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #d97c7c;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-top: 20px;
    }
    footer {
      background: #e8c6c6;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Nguyen & Linh</h1>
    <p>Chúng tôi sắp kết hôn!</p>
  </header>

  <div class="section">
    <h2>Ngày trọng đại</h2>
    <p>Ngày 20 tháng 12, 2026 tại TP. Hồ Chí Minh</p>
    <a href="#" class="btn">Xem địa điểm</a>
  </div>

  <div class="section">
    <h2>Lời mời</h2>
    <p>Chúng tôi hân hạnh mời bạn đến chung vui trong ngày trọng đại của mình.</p>
    <a href="#" class="btn">Xác nhận tham dự</a>
  </div>

  <footer>
    <p>© 2026 Nguyen & Linh Wedding</p>
  </footer>
</body>
</html>
